- commits:
    - subject: Move the adapter to its own subpath
      hash: e0e4fc41170d8cc68e0d15c254a6128effe09da8
      body: >
        index re-exported the adapter, so consumers saw an error for the missing

        @balena/compose-parser types even if they never touched it. Only the
        subpath

        needs that peer dependency now.
      footer:
        Change-type: patch
        change-type: patch
      author: Christina Ying Wang
      nested: []
    - subject: Add snapshot tests and a compose-go shape adapter
      hash: 607ced137a2573f03fdf02b5a0fd6174effc3d75
      body: >
        Renovate will patch this package, which is also how its behaviour
        drifts, and a

        YAML loader can change how a compose file parses without this parser
        changing at

        all. So test/snapshots covers the whole pipeline the builder runs,
        taking YAML

        source through js-yaml, then normalize and parse.


        The adapter maps our output onto the compose-go types, so the builder
        can feed

        both parsers into one build pipeline. It emits build.tag as well as
        build.tags,

        because @balena/compose still reads task.tag at runtime and emitting
        only tags

        would quietly stop tagging images.
      footer:
        Change-type: patch
        change-type: patch
      author: Christina Ying Wang
      nested: []
    - subject: Add packaging, CI and lint config
      hash: d46b5ad52690ae4f9f7e6b2450e9cb7217a51a74
      body: >
        The parser arrives with its history from balena-compose, where it lived
        at

        lib/parse. This adds what it needs to stand on its own, trims the
        dependencies

        from 22 to the four it imports, and points the tests at the new paths.


        js-yaml is not among the dependencies. The parser takes an
        already-loaded

        object, so the caller does the YAML loading.
      footer:
        Change-type: major
        change-type: major
      author: Christina Ying Wang
      nested: []
    - subject: Set label values to stringified number
      hash: 56118c5bf767929b1eaf0f05b05e6dc16fbf9040
      body: |
        ImageLabel.value needs to be a string and not a number.
        Currently our builder fails due to the API throwing a DB
        error due to the type mismatch.
      footer:
        Change-type: patch
        change-type: patch
      author: joshbwlng
      nested: []
    - subject: Support sw.os and sw.kernel contract requirement variants, allow
        multiple variants
      hash: 3dbfabd2bc868c7e0b94aa43d9b8a56fc5eccc9c
      body: >
        This allows users to specify an OS slug as a contract requirement, for
        example

        io.balena.features.requires.sw.balena-os:>VERSION, which transforms to

        {type:'sw.os',slug:'balena-os',version:'>VERSION'}. Similarly,

        io.balena.features.requires.sw.linux:>VERSION transforms to

        {type:'sw.kernel',slug:'linux',version:'>VERSION'}. This allows for

        eventual flexibility in OS and kernel requirements for a container.


        Currently we only support the 'balena-os' sw.os variant and the

        'linux' sw.kernel variant.
      footer:
        See: https://balena.fibery.io/Work/Project/Add-kernel-and-OS-version-to-container-contracts-1916
        see: https://balena.fibery.io/Work/Project/Add-kernel-and-OS-version-to-container-contracts-1916
        Change-type: minor
        change-type: minor
        Signed-off-by: Christina Ying Wang <christina@balena.io>
        signed-off-by: Christina Ying Wang <christina@balena.io>
      author: Christina Ying Wang
      nested: []
